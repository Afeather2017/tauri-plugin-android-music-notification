[package]
name = "tauri-plugin-android-music-notification"
version = "0.3.0"
authors = [ "Afeather" ]
description = "A Tauri plugin for Android music playback with media notification"
edition = "2021"
rust-version = "1.77.2"
repository = "https://github.com/Afeather2017/tauri-plugin-android-music-notification"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "music-notification"
license = "MIT"

[dependencies]
tauri = { version = "2.9.1" }
serde = "1.0"
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
tauri-plugin = { version = "2.5.1", features = ["build"] }

[dev-dependencies]
serde_json = "1.0"
